<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#091829" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield Body -->
  <g filter="url(#glow)">
    <path d="M 256 90 L 375 140 C 375 270 256 365 256 410 C 256 365 137 270 137 140 Z" 
          fill="#0c233c" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Badge / Document Grid -->
  <path d="M 190 200 L 322 200" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 190 235 L 322 235" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M 190 270 L 260 270" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- High-contrast Verification Checkmark -->
  <path d="M 215 315 L 245 345 L 315 275" 
        fill="none" 
        stroke="#22c55e" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Micro pill banner: CERMAT -->
  <rect x="166" y="112" width="180" height="34" rx="17" fill="#0284c7" />
  <text x="256" y="135" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="3" 
        text-anchor="middle">CERMAT</text>
</svg>
